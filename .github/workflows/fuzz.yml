name: fuzz

# `tests/fuzz_corpus.rs` is generated offline and committed, which makes it
# reproducible and completely static: it has asserted the same 200 trees since
# the day it was written, and no amount of re-running finds anything new. This
# job generates a corpus nobody has seen before and runs that instead.
#
# What makes the corpus worth fuzzing is that each case carries the value
# computed offline in rational arithmetic, so a wrong answer is caught by a
# number derived independently of both the macro and Rust's evaluator.
on:
  schedule:
    - cron: '19 8 * * 1'
  workflow_dispatch:
    inputs:
      seed:
        description: 'Generator seed (default: today, as YYYYMMDD)'
        required: false
        type: string

# `issues: write` is what the reporting step below needs. A seed that fails is
# a bug report with a reproducer attached, and nobody reads a weekly cron's
# logs on the off chance.
permissions:
  contents: read
  issues: write

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Generate a corpus nobody has run
        id: gen
        # Through the environment, never interpolated into the script: a `${{
        # }}` in a `run:` block is substituted into the shell *source* before
        # the shell sees it, so its text becomes code. Only a dispatcher can
        # set this input today, but the trigger is the only thing making that
        # true, and `release.yml` already takes its `version` this way.
        env:
          SEED_INPUT: ${{ inputs.seed }}
        run: |
          # The date, so a failure is reproducible from the log alone and a
          # re-run on the same day tests the same trees rather than quietly
          # moving on from the one that failed.
          seed="$SEED_INPUT"
          [ -n "$seed" ] || seed=$(date -u +%Y%m%d)
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "::notice::fuzzing with seed $seed"

          # Two seeds, as the committed pair uses: the f32 corpus explores
          # different trees rather than the same ones at half the width.
          python3 scripts/gen-fuzz-corpus.py --seed "$seed" \
            --count 200 --chains 80 --nodes 40 --width 64 \
            > reassoc/tests/fuzz_corpus.rs
          python3 scripts/gen-fuzz-corpus.py --seed "$((seed + 1))" \
            --count 100 --chains 40 --nodes 24 --width 32 \
            > reassoc/tests/fuzz_corpus_f32.rs
          rustfmt --edition 2024 reassoc/tests/fuzz_corpus.rs reassoc/tests/fuzz_corpus_f32.rs

      - id: test
        run: cargo test -p reassoc --test fuzz_corpus --test fuzz_corpus_f32

      # The corpus is not committed, so a failure is otherwise unreproducible:
      # without these files the log says only that something went wrong.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-corpus-${{ steps.gen.outputs.seed }}
          path: reassoc/tests/fuzz_corpus*.rs

      # Only for a corpus that actually failed. A broken runner, or a
      # generator that would not run, is not a finding about this crate, and
      # filing it as one would train the label to be ignored.
      - name: File the failing seed
        if: failure() && steps.test.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ steps.gen.outputs.seed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="fuzz: the corpus from seed $SEED does not pass"
          export TITLE
          NEXT=$((SEED + 1))
          {
            printf '%s\n\n' "A generated expression tree disagreed with the value computed offline in rational arithmetic. That number comes from neither the macro nor Rust's evaluator, so a disagreement is a defect in one of them rather than a tolerance to widen."
            printf 'Run: %s\n' "$RUN"
            printf '%s\n\n' "The corpus that failed is attached to that run as an artifact."
            printf '%s\n' 'Reproduce:'
            printf '%s\n' '```sh'
            printf 'python3 scripts/gen-fuzz-corpus.py --seed %s \\\n' "$SEED"
            printf '%s\n' '    --count 200 --chains 80 --nodes 40 --width 64 > reassoc/tests/fuzz_corpus.rs'
            printf 'python3 scripts/gen-fuzz-corpus.py --seed %s \\\n' "$NEXT"
            printf '%s\n' '    --count 100 --chains 40 --nodes 24 --width 32 > reassoc/tests/fuzz_corpus_f32.rs'
            printf '%s\n' 'cargo test -p reassoc --test fuzz_corpus --test fuzz_corpus_f32'
            printf '%s\n\n' '```'
            printf '%s\n' 'Restore the committed corpora with `git checkout reassoc/tests/fuzz_corpus*.rs`.'
          } > /tmp/fuzz-issue.md

          # One issue per seed: two failing seeds are two different trees and
          # almost certainly two different bugs. A re-run of the same seed
          # comments rather than filing a duplicate.
          existing=$(gh issue list --state open --label ci-failure --limit 100 \
            --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Seen again: $RUN"
          else
            gh issue create --title "$TITLE" --label ci-failure --label bug --body-file /tmp/fuzz-issue.md
          fi

      - name: Summarise
        if: always()
        # As above, and for the same reason: this seed is the dispatch input
        # when there was one, so it carries whatever that carried.
        env:
          SEED: ${{ steps.gen.outputs.seed }}
        run: |
          NEXT=$((SEED + 1))
          {
            echo "### Seed \`$SEED\`"
            echo
            echo 'Reproduce locally:'
            echo
            echo '```sh'
            echo "python3 scripts/gen-fuzz-corpus.py --seed $SEED \\"
            echo "    --count 200 --chains 80 --nodes 40 --width 64 > reassoc/tests/fuzz_corpus.rs"
            echo "python3 scripts/gen-fuzz-corpus.py --seed $NEXT \\"
            echo "    --count 100 --chains 40 --nodes 24 --width 32 > reassoc/tests/fuzz_corpus_f32.rs"
            echo "cargo test -p reassoc --test fuzz_corpus --test fuzz_corpus_f32"
            echo '```'
            echo
            echo 'Restore the committed corpora with `git checkout reassoc/tests/fuzz_corpus*.rs`.'
          } >> "$GITHUB_STEP_SUMMARY"
