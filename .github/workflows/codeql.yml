name: codeql

# `actions` is why this exists: three workflows run unattended on a schedule,
# two hold `issues: write`, and the bug that matters is a `${{ }}` expanded
# into the source of a `run:` block. `fuzz.yml` had one. Per-language notes
# are on the matrix entries below.
#
# Off the hour, and after CI's own Monday run, for the reason `ci.yml` gives.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '7 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Same rule as `ci.yml`: a second push to a branch makes the first answer
# irrelevant, but main keeps a result for every commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # The only scope that does anything here, and the reason the actions
      # below are pinned by commit rather than by a tag somebody else can move.
      security-events: write
      contents: read
      actions: read
    strategy:
      # One language failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          # Interpreted; `none` is the only build mode it has.
          - language: actions
            build-mode: none
          # Also the only mode Rust has: CodeQL 2.26.3 rejects `autobuild`
          # with "Rust does not support the autobuild build mode". Hence the
          # standing "Low Rust analysis quality" warning (call targets resolve
          # at 41% against a 50% threshold, with no build to resolve `syn` and
          # friends). A property of the extractor; not configurable away.
          - language: rust
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:${{ matrix.language }}
