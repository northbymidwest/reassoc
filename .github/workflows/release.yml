name: release
# The version in the run's title: the `release` environment pauses the job
# before its first step, so the approval page shows nothing but this line
# and the dispatch inputs. A dry run says so, since it is the run that looks
# identical and does nothing.
run-name: release ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Publishes both packages, then tags. That order is the whole design.
#
# The `v*` tags are protected with no bypass actors, so a tag is permanent for
# everyone the moment it lands: it cannot be deleted, moved or updated. A
# release triggered *by* a tag would therefore burn a version number for good
# every time anything downstream failed, and leave a tag pointing at a commit
# that never shipped. So the tag is an output of a release that already
# succeeded, never its trigger.
#
# Nothing is published until every preflight check passes, and a failed
# preflight costs nothing at all: no tag, no burnt version, one red run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.11.3)'
        required: true
        type: string
      dry_run:
        description: 'Stop before publishing anything'
        required: false
        default: true
        type: boolean

# The two jobs split at the approval. `preflight` has no environment and no
# write scope: it can only check and report, so nothing is lost by running
# it before anyone has approved anything, and what it writes to its summary
# (version, mode, commit, CI, the release notes verbatim) is what the
# approver is deciding about. `publish` is the only job with the environment
# and the scopes that upload and tag, and it does nothing else.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `actions: read` is for the CI-is-green query below. A public repository
    # allows it implicitly; naming it keeps that true if this one stops being
    # public.
    permissions:
      contents: read
      actions: read
    outputs:
      publish_macros: ${{ steps.preflight.outputs.publish_macros }}
      publish_facade: ${{ steps.preflight.outputs.publish_facade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - name: Preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -eu
          fail() { echo "::error::$1"; exit 1; }
          # A dry run is meant to be usable on a version that already shipped,
          # which is the only way to exercise this before trusting it. The two
          # "already exists" checks would refuse that by design, so on a dry
          # run they report instead of stopping. Everything else still stops.
          soft() { if [ "$DRY" = "true" ]; then echo "::warning::(dry run) $1"; else fail "$1"; fi; }
          echo "mode: $([ "$DRY" = true ] && echo 'DRY RUN, nothing will be published' || echo 'REAL, this publishes')"

          case "$VERSION" in
            v*) fail "give the version without the leading v: 0.11.3, not $VERSION" ;;
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) fail "not a version: $VERSION" ;;
          esac

          # Both packages move in lockstep and the facade pins the macros crate
          # exactly, so a bump that misses one is the mistake RELEASING.md warns
          # about. Read them rather than trust them.
          ws=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          pin=$(sed -n 's/.*reassoc-macros = { version = "=\([^"]*\)".*/\1/p' reassoc/Cargo.toml | head -1)
          [ "$ws" = "$VERSION" ] || fail "Cargo.toml says $ws, you asked for $VERSION"
          [ "$pin" = "$VERSION" ] || fail "the facade pins reassoc-macros =$pin, not =$VERSION"

          # The tag must not already exist: it could not be replaced if it did.
          # What each check found is recorded as well as judged, so the
          # summary below reports the state rather than the expectation; on a
          # dry run against a shipped version the two differ.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            soft "tag v$VERSION already exists, and protected tags cannot be moved"
            echo "tag=already exists (protected: cannot be moved)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=free" >> "$GITHUB_OUTPUT"
          fi

          # Neither version may already be on crates.io. A publish there is
          # irreversible, so finding out at upload time is finding out too late.
          #
          # One exception: the macros crate live, the facade not, and no tag,
          # which is what a release that died between its two uploads leaves.
          # Refusing it would burn a version number for what is usually a
          # propagation hiccup, so it resumes instead, uploading the facade
          # alone at the same commit with every other check still applying. The
          # reverse, which no release can produce, is still fatal.
          live() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: reassoc-release-workflow' \
              "https://crates.io/api/v1/crates/$1/$VERSION")
            case "$code" in
              404) return 1 ;;
              200) return 0 ;;
              *) fail "crates.io answered HTTP $code for $1 $VERSION; cannot tell whether it is published" ;;
            esac
          }
          macros_live=false
          facade_live=false
          if live reassoc-macros; then macros_live=true; fi
          if live reassoc; then facade_live=true; fi
          publish_macros=true
          publish_facade=true

          if [ "$macros_live" = true ] && [ "$facade_live" = true ]; then
            soft "both crates already have $VERSION on crates.io"
            registry="both already published"
          elif [ "$macros_live" = true ]; then
            if [ "$DRY" = "true" ]; then
              echo "::warning::(dry run) reassoc-macros $VERSION is published and reassoc is not"
            else
              echo "::notice::resuming a half-finished release: reassoc-macros $VERSION is already published, reassoc is not"
            fi
            publish_macros=false
            registry="RESUME: reassoc-macros already published, reassoc is not; only the facade will be uploaded"
          elif [ "$facade_live" = true ]; then
            soft "reassoc $VERSION is on crates.io but reassoc-macros $VERSION is not, which no release can produce; check by hand"
            registry="reassoc published, reassoc-macros not: inconsistent"
          else
            registry="neither published"
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "publish_macros=$publish_macros" >> "$GITHUB_OUTPUT"
          echo "publish_facade=$publish_facade" >> "$GITHUB_OUTPUT"

          # CI must already be green on this exact commit. Queried rather than
          # re-run: the suite is twelve jobs and it has already passed.
          sha=$(git rev-parse HEAD)
          concl=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | .[0].conclusion // "none"')
          [ "$concl" = "success" ] || fail "CI on $sha is '$concl', not success"

          # The notes are that version's own CHANGELOG section; an empty one
          # means the entry was never written.
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || fail "CHANGELOG.md has no section for $VERSION"

          # Entries accumulate under `## Unreleased` and releasing retitles
          # that heading (RELEASING.md). Anything still under it here was
          # written down and is about to ship outside the release notes, which
          # is the one failure mode the convention introduces. Whitespace only
          # is fine: it means the heading was left behind empty, not that a
          # change was missed.
          awk '/^## Unreleased[[:space:]]*$/{f=1;next} /^## /{f=0} f' CHANGELOG.md > /tmp/unreleased.md
          if grep -q '[^[:space:]]' /tmp/unreleased.md 2>/dev/null; then
            fail "CHANGELOG.md still has entries under '## Unreleased'; retitle that heading to '## $VERSION - <date>'"
          fi

          echo "preflight ok: $VERSION at $sha, CI green, neither crate published"

      # Assembles both archives and compiles the macros crate from its own
      # archive, so a publish blocker surfaces before anything is uploaded.
      - run: cargo package -p reassoc-macros
      - run: cargo package -p reassoc --no-verify --exclude-lockfile

      # What the approver reads. Everything above passed, so this is a
      # statement of what approving will do, with the notes as they will
      # appear on the GitHub release.
      - name: For review
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
          RUNS: ${{ github.server_url }}/${{ github.repository }}/actions/runs
          TAG: ${{ steps.preflight.outputs.tag }}
          REGISTRY: ${{ steps.preflight.outputs.registry }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          subject=$(git log -1 --format=%s)
          ci=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | .[0].id // empty')
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > /tmp/notes.md
          {
            if [ "$DRY" = true ]; then
              echo "## Dry run: \`$VERSION\` (nothing will be published or tagged)"
            else
              echo "## Release \`$VERSION\`: approving publishes both crates and tags \`v$VERSION\`"
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$VERSION\` (both manifests agree) |"
            echo "| commit | \`$sha\` $subject |"
            echo "| CI | [green on this commit]($RUNS/$ci) |"
            echo "| tag | \`v$VERSION\`: $TAG |"
            echo "| crates.io | $REGISTRY |"
            echo "| archives | both assemble (\`cargo package\`) |"
            echo
            if [ "$DRY" = true ]; then
              echo
              echo "A taken tag or a published version is reported, not fatal, on a dry run;"
              echo "a real run stops at either."
            fi
            echo
            echo "### Release notes, verbatim from \`CHANGELOG.md\`"
            echo
            cat /tmp/notes.md
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Scopes the OIDC token to this environment, and is where the required
    # reviewer pauses the run. By now `preflight` has passed and its summary
    # is on the run page: the approval page links to it.
    environment: release
    permissions:
      contents: write   # create the tag and the release
      id-token: write   # trusted publishing: exchange OIDC for a crates.io token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      # Trusted publishing: a short-lived token from OIDC, so the repository
      # holds no standing credential that could publish. This runs on a dry
      # run too: the token exchange is the one part with no offline test, so
      # exercising it is most of why the dry run exists. Getting a token
      # publishes nothing.
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # Order is mandatory: the facade pins `=<version>` and resolves it
      # against the registry, not the workspace, so the macros crate must be
      # live first.
      # Skipped when preflight found it already published: that is the
      # half-finished release being resumed, not a fresh one.
      - name: Publish reassoc-macros
        if: ${{ !inputs.dry_run && needs.preflight.outputs.publish_macros == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p reassoc-macros

      - name: Publish reassoc
        if: ${{ !inputs.dry_run && needs.preflight.outputs.publish_facade == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p reassoc

      # Only now. Everything above can fail without leaving a mark; from here
      # on the tag is permanent, and so is what it points at.
      #
      # The tag ruleset restricts creation of `v*` to one bypass actor, a
      # deploy key, whose private half is the `release` environment's
      # `RELEASE_TAG_KEY`. `GITHUB_TOKEN` cannot be a bypass actor, so the
      # push goes over SSH with that key and nothing else on offer (`-F
      # /dev/null`, no agent: a stray identity would be rejected, not the
      # key). GitHub's host keys come from its API rather than a hardcoded
      # fingerprint. The key file lives only for this step.
      - name: Tag and release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_TAG_KEY: ${{ secrets.RELEASE_TAG_KEY }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          dir=$(mktemp -d)
          trap 'rm -rf "$dir"' EXIT
          printf '%s\n' "$RELEASE_TAG_KEY" > "$dir/key"
          chmod 600 "$dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com \(.)"' > "$dir/known_hosts"
          GIT_SSH_COMMAND="ssh -F /dev/null -i $dir/key -o IdentitiesOnly=yes -o IdentityAgent=none -o UserKnownHostsFile=$dir/known_hosts -o StrictHostKeyChecking=yes" \
            git push "git@github.com:${{ github.repository }}.git" "$sha:refs/tags/v$VERSION"
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 {f=1;next} /^## /{f=0} f' CHANGELOG.md > /tmp/notes.md
          # Pre-release, as every release here is: the README calls the crate
          # experimental, and a 0.x moving this fast should not present any
          # version as the settled one.
          gh release create "v$VERSION" --title "v$VERSION" \
            --notes-file /tmp/notes.md --prerelease --verify-tag
          echo "::notice::published $VERSION and tagged v$VERSION at $sha"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "### Dry run for \`$VERSION\`"
            echo
            echo "Everything up to the first upload ran, the crates.io token"
            echo "exchange included. Nothing was published and nothing tagged."
            echo
            echo "A real run additionally would have:"
            echo
            echo "1. \`cargo publish -p reassoc-macros\`"
            echo "2. \`cargo publish -p reassoc\`"
            echo "3. created tag \`v$VERSION\` at this commit, permanently"
            echo "4. cut the GitHub release from the CHANGELOG section"
            echo
            echo "Any warnings above about the version or tag already existing"
            echo "are expected when rehearsing on a version that has shipped;"
            echo "on a real run each of them stops the release."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::dry run complete: nothing published, nothing tagged"
