name: release
run-name: release ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Publishes reassoc-macros then reassoc, then tags, through the shared composites
# in northbymidwest/gh-actions (see that repo's README for the design). Order is
# mandatory: the facade pins reassoc-macros "=<version>" and resolves it against
# the registry, so the macros crate must be live first; preflight's `pins` check
# asserts that exact pin holds. The tag is an output of a succeeded release,
# never its trigger. Pure Rust, so the whole flow runs on Ubuntu.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 0.14.3)'
        type: string
        required: true
      dry_run:
        description: 'Stop before publishing anything'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.pre.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pre
        uses: northbymidwest/gh-actions/release-preflight@496015a8343b15f2cfb1c04ce6955a4c5602d556 # v0.2.1
        with:
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry_run }}
          crates: Cargo.toml
          packages: |
            reassoc-macros
            reassoc
          pins: reassoc/Cargo.toml|reassoc-macros|
          token: ${{ github.token }}
      - uses: northbymidwest/gh-actions/release-review-summary@496015a8343b15f2cfb1c04ce6955a4c5602d556 # v0.2.1
        with:
          version: ${{ inputs.version }}
          dry-run: ${{ inputs.dry_run }}
          tag: ${{ steps.pre.outputs.tag }}
          registry: ${{ steps.pre.outputs.registry }}
          what-approving-does: publishes reassoc-macros and reassoc and tags v${{ inputs.version }}
          token: ${{ github.token }}

  publish:
    needs: preflight
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: northbymidwest/gh-actions/release-publish-crate@496015a8343b15f2cfb1c04ce6955a4c5602d556 # v0.2.1
        with:
          packages: |
            reassoc-macros
            reassoc
          publish: ${{ needs.preflight.outputs.publish }}
          dry-run: ${{ inputs.dry_run }}
      - uses: northbymidwest/gh-actions/release-tag@496015a8343b15f2cfb1c04ce6955a4c5602d556 # v0.2.1
        with:
          version: ${{ inputs.version }}
          deploy-key: ${{ secrets.RELEASE_TAG_KEY }}
          token: ${{ github.token }}
          dry-run: ${{ inputs.dry_run }}
