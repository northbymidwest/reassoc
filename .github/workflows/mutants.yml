name: mutants

# Mutation-test the rewriter: a surviving mutant is a line of `rewrite.rs`
# that no test observes. The whole `reassoc` suite runs once per mutant, which
# once looked too slow to put in front of a change; measured with a warm
# cache it is about ten minutes, and a change to the rewriter that loses the
# test observing it is exactly what a push should hear about, not the
# following Monday. So it runs on every push and pull request like `ci.yml`,
# and weekly besides, so a toolchain moving under the suite is still seen.
#
# The Monday run is an hour after CI's own, so a red here is never just the
# toolchain having moved underneath it.
on:
  push:
  pull_request:
  schedule:
    - cron: '43 7 * * 1'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Override the survivor baseline (to exercise the reporting path)'
        required: false
        type: string

# `issues: write` is for the reporting step: a survivor that appears on a
# Monday and is never read about is the same as no job at all. Only the
# unattended runs file anything; a push or pull request has a red check that
# somebody is already looking at.
permissions:
  contents: read
  issues: write

# A newer push cancels the run in progress, on main included. `ci.yml` keeps
# a result for every commit on main because those are verdicts on the
# commit; this is a report on the suite, twelve minutes long, and the run on
# the newest commit says everything the superseded one would have. Commits
# pushed directly to main in a burst otherwise queue behind each other for
# the rest of the hour. The weekly run is its own group that nothing cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Survivors that cannot be killed rather than gaps in the suite. Nine
      # are the `REASSOC_TRACE` machinery, invisible here because its test
      # shells out to cargo and the script excludes the shell-outs; the rest
      # are equivalent mutants, each documented at its site. Lowering this is
      # the point. Raising it needs a reason in the commit message.
      BASELINE: ${{ inputs.baseline || '18' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The pinned toolchain with `rust-src`, for the same reason the `ui` job
      # needs it: the run includes the trybuild cases, and five of them quote a
      # line of `core` that rustc can only render with core's source present.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.98.0
          components: rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Pinned deliberately. `scripts/mutants.sh` wraps `cargo` to redirect a
      # flag that 27.x passes regardless of `--test-package`; a release that
      # stopped doing that would quietly test the wrong package and report
      # everything as caught.
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2
        with:
          tool: cargo-mutants@27.1.0

      - name: Mutate the rewriter
        id: mutate
        env:
          NO_COLOR: 1
        run: |
          set -o pipefail
          # Exit 2 is cargo-mutants for "survivors found", which is the normal
          # state here. Anything else is a real failure.
          scripts/mutants.sh 2>&1 | tee mutants.log && status=0 || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "${status:-0}" -ne 2 ]; then
            echo "::error::cargo-mutants exited $status"
            exit "$status"
          fi

          missed=$(grep -c '^MISSED' mutants.log || true)
          echo "missed=$missed" >> "$GITHUB_OUTPUT"
          {
            echo "## $missed surviving mutants (baseline $BASELINE)"
            echo
            echo '```'
            grep '^MISSED' mutants.log | sed -E 's/ in [0-9]+s build.*//' || echo '(none)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$missed" -gt "$BASELINE" ]; then
            echo "regression=true" >> "$GITHUB_OUTPUT"
            echo "::error::$missed surviving mutants against a baseline of $BASELINE; a line of the rewriter has lost the test that observed it"
            exit 1
          fi
          if [ "$missed" -lt "$BASELINE" ]; then
            echo "::notice::$missed surviving mutants, below the baseline of $BASELINE; lower BASELINE in this workflow to hold the ground"
          fi
          echo "$missed surviving mutants, at or below the baseline of $BASELINE"

      # Only for a genuine regression in the count. An install that failed or
      # a runner that died is not a finding about the suite.
      - name: File a survivor regression
        if: always() && steps.mutate.outputs.regression == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          MISSED: ${{ steps.mutate.outputs.missed }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="mutants: surviving mutants above the baseline"
          export TITLE
          {
            printf '%s\n\n' "\`scripts/mutants.sh\` found $MISSED surviving mutants against a baseline of $BASELINE. A survivor is a line of the rewriter that no test observes, so the gap is in the suite rather than in the code: something changed that nothing was watching."
            printf 'Run: %s\n\n' "$RUN"
            printf '%s\n' 'Every survivor in this run:'
            printf '%s\n' '```'
            grep '^MISSED' mutants.log | sed -E 's/ in [0-9]+s build.*//' | sed -E 's|reassoc-macros/src/||'
            printf '%s\n\n' '```'
            printf '%s\n' "The baseline covers $BASELINE that cannot be killed: the \`REASSOC_TRACE\` machinery this run cannot observe, and equivalent mutants documented at each site. Anything beyond that is new."
          } > /tmp/mutants-issue.md

          # One rolling issue: a count above the baseline is a single ongoing
          # condition, not a fresh bug each week. Fifty-two identical tickets
          # a year would be worse than none.
          existing=$(gh issue list --state open --label ci-failure --limit 100 \
            --json number,title --jq 'map(select(.title == env.TITLE)) | .[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/mutants-issue.md
          else
            gh issue create --title "$TITLE" --label ci-failure --body-file /tmp/mutants-issue.md
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutants
          path: |
            mutants.log
            target/mutants/mutants.out/outcomes.json
          if-no-files-found: warn
