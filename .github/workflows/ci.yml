name: CI

on:
  push:
  pull_request:
  # Nothing here is pinned to this repository's own activity: `stable` moves
  # every six weeks, `beta` every day it is rebuilt, `nightly` every night.
  # Between releases nobody pushes, so a toolchain change that breaks the
  # crate would sit unseen until the next commit, which is the worst moment
  # to learn about it. Once a week, unprompted, is the whole point.
  #
  # Off the hour: scheduled jobs queue behind everyone else's :00 cron.
  #
  # GitHub disables a schedule in a public repository after 60 days without
  # a commit, and mails the owner. A quiet stretch that long is exactly when
  # this matters, so treat that mail as a prompt to re-enable it.
  schedule:
    - cron: '37 6 * * 1'
  # So the schedule's path can be exercised without waiting for Monday.
  workflow_dispatch:

# No job here writes anything back: they build, test and lint a checkout. The
# default token is read-write, so this drops it to what is actually used.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
# Cancel it rather than queue behind it. `github.ref` keeps branches and PRs
# in separate groups, so a push to main never cancels a PR's run.
#
# Not on main, though: commits land there directly, and cancelling would
# leave a commit with no result, and the badge and the history should say
# something about every one of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p reassoc --no-default-features
      - run: cargo test -p reassoc --no-default-features --features alloc
      # A consumer that renames the dependency, with `resolve-crate-name` on.
      # Inside this repository the feature only ever takes the `Itself` path.
      - run: cargo test -p reassoc --test renamed -- --ignored

  # `test` above already runs the newest stable: `@stable` resolves to it and
  # follows each release. This job is the other direction: the release that
  # has not happened yet. A regression caught here is six weeks from reaching
  # anyone, which is the difference between reporting it upstream and finding
  # out from an issue. Add `continue-on-error: true` if a beta ever breaks for
  # reasons that are not this crate's and the red becomes noise.
  #
  # The UI tests do not run here: they are `#[ignore]`d and compare rustc's
  # rendered diagnostics against a pinned toolchain, so beta would fail them
  # by construction.
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@beta
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p reassoc --no-default-features

  no_std:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p reassoc --no-default-features --target thumbv7em-none-eabi

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Compiler-diagnostic tests are pinned: rustc renders the expected .stderr,
  # so a newer toolchain fails them for reasons unrelated to this crate.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # `rust-src` is required, not optional. Several expected `.stderr` files
      # contain a "the trait must be implemented" note that quotes a source
      # line out of `core`. rustc can only render that line when it can read
      # core's source, so without this component those five tests mismatch on
      # exactly the quoted-source lines.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p reassoc --test ui -- --ignored

  # `f16` and `f128` are unstable (rust-lang/rust#116909); the features that
  # make them algebraic build only on nightly. Each alone, then both.
  nightly_floats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      # No cache here on purpose. rust-cache keys on the rustc version and
      # nightly changes daily, so this job would miss almost every time and
      # pay the save cost for nothing: measured at 92s uncached against 112s
      # with a cache it could not use.
      - run: cargo test -p reassoc --features f16
      - run: cargo test -p reassoc --features f128
      - run: cargo test -p reassoc --features f16,f128
      - run: cargo test -p reassoc --features const-fn
      - run: cargo test -p reassoc --features f16,f128,const-fn
      - run: cargo test -p reassoc --no-default-features --features f16,f128,const-fn
      - run: cargo clippy -p reassoc --all-targets --features f16,f128,const-fn -- -D warnings

  # The floors in Cargo.toml are a promise: build against exactly these
  # versions and this crate works. Every other job resolves to the newest
  # compatible release, so none of them has ever exercised one: the single
  # verification was by hand, and two of the floors had drifted below what
  # they could resolve to at all. `-Z direct-minimal-versions` pins every
  # direct dependency to its declared floor and builds that.
  #
  # Nightly because the flag is unstable, and uncached for the same reason
  # `nightly_floats` is. What is under test here is the manifest, not the
  # compiler, so the toolchain being nightly costs nothing.
  minimal_versions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo update -Z direct-minimal-versions
      - run: cargo test --workspace

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches publish blockers (missing description, unshipped LICENSE)
      # before release rather than at `cargo publish` time.
      - run: cargo package -p reassoc-macros
      # --exclude-lockfile: reassoc pins reassoc-macros by exact version, which
      # doesn't exist on crates.io until first publish, so a full `cargo
      # package` (which resolves a Cargo.lock against the registry) fails here
      # pre-release. Excluding the lockfile skips that resolution while still
      # assembling and checking the real archive contents.
      - run: cargo package -p reassoc --no-verify --exclude-lockfile

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Feature-gated code is only linted when its feature is on. The
      # `resolve-crate-name` path broke the crate's own examples and no
      # default-feature run could have seen it.
      # Explicit features rather than `--all-features`: `f16` and `f128` are
      # nightly-only and have their own job below.
      - run: cargo clippy --workspace --all-targets --features resolve-crate-name -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - run: cargo doc --workspace --no-deps --features resolve-crate-name
        env:
          RUSTDOCFLAGS: -D warnings
      # The offline expander shares the rewriter by `#[path]` but mirrors
      # `krate` by hand; this catches the mirror drifting.
      - run: cargo build --release --manifest-path scripts/compile-bench/expander/Cargo.toml
      # The diagnostics comparison must keep running (its cases track the
      # current macro surface); its output is informational.
      - run: python3 scripts/diag-compare.py
      # The repository is ASCII only. `.githooks/pre-commit` runs the same
      # script, but hooks are per-clone and `--no-verify` skips them, so this
      # is where it is actually enforced.
      - run: scripts/check-ascii.sh

  # The crate promises one thing about its surface: the macros are the API,
  # and the dispatch layer they expand into is machinery, not a contract.
  # Nothing enforced that promise, so an item that drifted into public view
  # would have been found by a user, not by CI. This compares the working
  # tree against the newest release on crates.io and fails when a change
  # needs a larger version bump than the manifest carries.
  #
  # It reads signatures, so it cannot see the break that actually happened in
  # 0.11.0: a new blanket impl colliding with a hand-written `passthrough!`
  # in someone else's crate. Adding an impl changes no signature. That class
  # stays a judgement call at release time; this covers the other one.
  #
  # `consumers/*` are all `publish = false`, so only the two real packages
  # are considered.
  semver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: obi1kenobi/cargo-semver-checks-action@v2
