[package]
name = "reassoc-macros"
description = "Proc macros for the reassoc crate. Do not depend on this directly; use reassoc."
readme = "../README.md"
# `license` (below, workspace-inherited) is the SPDX identifier crates.io
# and license scanners read. The LICENSE file in this directory ships the
# text into the archive without needing `license-file`, which would
# otherwise warn on every build ("only one of license or license-file is
# necessary"). The canonical copy lives at the repo root; this is a real
# copy, kept in sync manually — 0BSD's text never changes.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[features]
# Off by default: `proc-macro-crate` pulls in toml parsing (8 crates), which is
# a poor trade for every consumer when renaming this dependency is rare. Turn
# it on only if you rename it.
resolve-crate-name = ["dep:proc-macro-crate"]
# Enter `const fn` bodies: the facade's dispatch layer is `const` under its
# feature of the same name (nightly). Never turn on alone.
const-fn = []

[dependencies]
proc-macro-crate = { version = "3.5", optional = true }
# Floors are the minimum we actually require, not the newest published: a
# needlessly high floor forces downstream upgrades for no reason. The whole
# suite passes with every one of them held at its floor, and the
# `minimal_versions` CI job is what keeps that true — every other job resolves
# to the newest compatible release and would never notice these rotting.
#
# `quote` and `proc-macro2` are not floored by anything this crate does: syn
# 3.0.0 requires `quote ^1.0.35` and `proc-macro2 ^1.0.91`, and a floor below
# what our own syn floor forces is a range that cannot be resolved at all.
# Both said `1.0` until that job was added and said otherwise.
#
# `default-features = false` keeps the enabled set explicit. `clone-impls` is
# needed because the rewriter clones `Expr` nodes, and `derive` because
# `#[derive(Passthrough)]` parses a `DeriveInput`.
syn = { version = "3.0", default-features = false, features = ["full", "visit-mut", "parsing", "printing", "proc-macro", "clone-impls", "derive"] }
quote = "1.0.35"
proc-macro2 = "1.0.91"
