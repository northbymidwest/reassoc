[package]
name = "reassoc-macros"
description = "Proc macros for the reassoc crate. Do not depend on this directly; use reassoc."
license-file = "../LICENSE"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# `license-file` above ships the LICENSE text in the archive; cargo warns if
# `license` is also set (only one is needed), so we don't inherit it here.
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.3", features = ["full", "visit-mut", "parsing", "printing", "proc-macro"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
