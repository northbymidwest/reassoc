[package]
name = "reassoc"
description = "Ordinary arithmetic syntax for Rust's algebraic float operators"
readme = "../README.md"
# `license` (below, workspace-inherited) is the SPDX identifier crates.io
# and license scanners read. The LICENSE file in this directory ships the
# text into the archive without needing `license-file`, which would
# otherwise warn on every build ("only one of license or license-file is
# necessary"). The canonical copy lives at the repo root; this is a real
# copy, kept in sync manually; 0BSD's text never changes.
keywords = ["fast-math", "float", "simd", "fma", "numerics"]
categories = ["mathematics", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# Forwarded: makes the macros work when this crate is renamed in Cargo.toml.
resolve-crate-name = ["reassoc-macros/resolve-crate-name"]
std = ["alloc"]
alloc = []
# `f16` / `f128` as algebraic floats. Nightly only: each type and its
# `algebraic_*` methods are unstable (rust-lang/rust#116909), so each turns on
# its own `#![feature(..)]` gate and fails to build on stable. Separate, since
# rustc gates them separately and they may stabilise apart.
f16 = []
f128 = []
# `#[algebraic]` on a `const fn`. Nightly only: the dispatch layer becomes
# `const` through `const_trait_impl`/`const_ops`. Forwarded to the macros,
# which then enter `const fn` bodies instead of refusing them.
const-fn = ["reassoc-macros/const-fn"]
# `reassoc::AlgebraicFloat`, a bound over the primitive floats for a crate with
# no float trait of its own. Unstable: not covered by semver, may change or
# disappear in any release, which is what the `unstable-` prefix says, and
# what makes `cargo-semver-checks` leave it out of the surface it compares.
unstable-algebraic-float-trait = []
# `#[algebraic(unsafe_fast)]` and `unsafe_fast!`: a scope whose float
# operators go to `core::intrinsics::f*_fast` (LLVM's full `fast` set, `nnan
# ninf` included) instead of the algebraic methods. Nightly only, and UB on a
# NaN or infinity anywhere in the scope, which the spelling says and the
# docs explain. Adds a spelling; changes nothing about `#[algebraic]`.
# Prototype: not combined with `const-fn` yet (`lib.rs`).
unstable-fast-math = ["reassoc-macros/unstable-fast-math"]

# `--cfg docsrs` turns on `doc_cfg` (see `lib.rs`), which marks the `alloc`
# and `std` impls with the feature they need. `f16`/`f128` are on because
# `float_lefts!` emits one impl per concrete type, so without them those two
# widths are absent from `AddRhs` and friends.
#
# `const-fn` is deliberately off: it adds no item, re-signs all ten `ops::*`
# as `const fn`, and documents each a second time under `ops::konst`.
[package.metadata.docs.rs]
features = ["f16", "f128", "unstable-algebraic-float-trait"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
reassoc-macros = { version = "=0.14.0", path = "../reassoc-macros" }

[dev-dependencies]
trybuild = "1.0"
# For the codegen matrix's IR normalisation.
regex-lite = "0.1"
# Types from another crate, for the `passthrough!(foreign ..)` tests.
foreign-types = { path = "../consumers/foreign-types" }

# `const impl` is feature-gated at parse time: the file cannot be compiled on
# stable even empty, so the target exists only with the feature.
[[test]]
name = "const_fn"
required-features = ["const-fn"]
