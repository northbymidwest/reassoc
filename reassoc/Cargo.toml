[package]
name = "reassoc"
description = "Ordinary arithmetic syntax for Rust's algebraic float operators"
readme = "../README.md"
# `license` (below, workspace-inherited) is the SPDX identifier crates.io
# and license scanners read. The LICENSE file in this directory ships the
# text into the archive without needing `license-file`, which would
# otherwise warn on every build ("only one of license or license-file is
# necessary"). The canonical copy lives at the repo root; this is a real
# copy, kept in sync manually; 0BSD's text never changes.
keywords = ["fast-math", "float", "simd", "fma", "numerics"]
categories = ["mathematics", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# Forwarded: makes the macros work when this crate is renamed in Cargo.toml.
resolve-crate-name = ["reassoc-macros/resolve-crate-name"]
std = ["alloc"]
alloc = []
# `f16` / `f128` as algebraic floats. Nightly only: each type and its
# `algebraic_*` methods are unstable (rust-lang/rust#116909), so each turns on
# its own `#![feature(..)]` gate and fails to build on stable. Separate, since
# rustc gates them separately and they may stabilise apart.
f16 = []
f128 = []
# `#[algebraic]` on a `const fn`. Nightly only: the dispatch layer becomes
# `const` through `const_trait_impl`/`const_ops`. Forwarded to the macros,
# which then enter `const fn` bodies instead of refusing them.
const-fn = ["reassoc-macros/const-fn"]

# docs.rs builds with default features unless told otherwise, and this crate
# gates visible impls behind four of them. `--cfg docsrs` turns on `doc_cfg`
# (see `lib.rs`), which is what puts "Available on crate feature `alloc`" on
# the `String` operand impls and on `Instant`/`SystemTime`, so a `no_std`
# reader can tell from the impl list alone which ones they get.
#
# `f16`/`f128` are on because they add impls that are actually rendered: the
# float-left blankets (`impls/float.rs`, `float_lefts!`) are one per concrete
# type, so without the features those two are simply absent from `AddRhs` and
# friends. Both are nightly, and docs.rs builds on nightly; `nightly_floats`
# in CI exercises the same combination weekly, so a break here is not found
# first by a failed docs build.
#
# `const-fn` is deliberately off. It adds no item: it re-signs all ten
# `ops::*` as `const fn` and, because the `konst` module is re-exported
# rather than inlined, documents every one of them a second time under
# `ops::konst`. The stable signature is the one nearly every reader wants,
# and the feature is described in prose in `lib.rs`. (Measured, not assumed:
# `cargo doc` with and without it, compared page by page.)
#
# `resolve-crate-name` changes nothing in this crate's surface; it is a
# `reassoc-macros` feature about path resolution in generated code.
[package.metadata.docs.rs]
features = ["f16", "f128"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
reassoc-macros = { version = "=0.11.3", path = "../reassoc-macros" }

[dev-dependencies]
trybuild = "1.0"
# For the codegen matrix's IR normalisation.
regex-lite = "0.1"
# Types from another crate, for the `passthrough!(foreign ..)` tests.
foreign-types = { path = "../consumers/foreign-types" }

# `const impl` is feature-gated at parse time: the file cannot be compiled on
# stable even empty, so the target exists only with the feature.
[[test]]
name = "const_fn"
required-features = ["const-fn"]
