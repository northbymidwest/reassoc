[package]
name = "reassoc"
description = "Ordinary arithmetic syntax for Rust's algebraic float operators"
readme = "../README.md"
# `license` is the SPDX identifier crates.io and license scanners read;
# `license-file` additionally ships the text, since LICENSE lives at the
# repo root outside both packages.
license-file = "../LICENSE"
keywords = ["float", "simd", "fma", "numerics", "macro"]
categories = ["mathematics", "no-std"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
reassoc-macros = { version = "=0.1.0", path = "../reassoc-macros" }

[dev-dependencies]
trybuild = "1.0.120"
