# A consumer that renames the dependency. Not a workspace member, on purpose:
# it turns on `resolve-crate-name`, and feature unification would turn that on
# for every workspace build, so the default path would stop being what the
# main suite tests. Built by `reassoc/tests/renamed.rs` (and CI) — the only
# way to exercise the feature as a consumer sees it; inside this repository it
# always takes the `FoundCrate::Itself` path, which is how 0.2.3's
# unresolvable-path bug shipped unseen.
[package]
name = "renamed"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
myalg = { package = "reassoc", path = "../../reassoc", features = ["resolve-crate-name"] }

[workspace]
